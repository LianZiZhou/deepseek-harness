# Fork-only: build unsigned Desktop packages for Windows, macOS, and Linux on
# every push to the default branch and publish them together as a GitHub
# release named after the commit's short hash.
#
# Nothing is signed or notarized (CI holds no EV token or Apple credentials) and
# no build carries an update feed, so installed copies never auto-update;
# install a newer release by hand. macOS builds carry a local ad-hoc signature
# and Gatekeeper asks for approval on first launch.
#
# Windows packaging requires a mandatory-update origin even for unsigned builds.
# It points at a reserved `.invalid` host so the fork never polls upstream's
# policy service, which could otherwise steer installs toward official builds.
# Unsigned macOS and Linux packaging carries no policy at all.
name: Fork desktop release

on:
  push:
    branches: [merge/upstream-0.2.0]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages as the desktop-<short hash> release; otherwise keep them as run artifacts only
        type: boolean
        default: true

concurrency:
  group: fork-desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.version.outputs.short }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          short=$(git rev-parse --short=7 HEAD)
          product=$(node -p "require('./apps/desktop/package.json').version")
          # A prerelease field must not be all digits with a leading zero, hence the `g`.
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build=$product.g$short" >> "$GITHUB_OUTPUT"
          echo "Desktop $product.g$short from $short"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: corepack enable && pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Write packaging settings
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=io.github.lianzizhou.dsh-desktop
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://update.invalid
          EOF

      - name: Package unsigned installer
        run: pnpm run package:desktop:win:x64:unsigned -- --build-version ${{ needs.version.outputs.build }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The Apple Silicon runner builds both; x64 preparation runs the x64 Electron under Rosetta.
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && pnpm --version

      - name: Install Rosetta
        if: matrix.arch == 'x64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package unsigned DMG
        run: pnpm run package:desktop:mac:${{ matrix.arch }}:unsigned -- --build-version ${{ needs.version.outputs.build }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: apps/desktop/.desktop-build/targets/mac-${{ matrix.arch }}/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # The repository build plus two prepared runtimes exceed the runner's default free space.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package unsigned AppImage
        run: pnpm run package:desktop:linux:x64:unsigned -- --build-version ${{ needs.version.outputs.build }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, windows, macos, linux]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: desktop-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHORT: ${{ needs.version.outputs.short }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          shopt -s nullglob
          files=(packages/*.exe packages/*.dmg packages/*.AppImage)
          if [ ${#files[@]} -ne 4 ]; then
            echo "expected 4 packages, found ${#files[@]}" >&2
            ls -la packages || true
            exit 1
          fi
          notes=$(cat <<EOF
          Unsigned Desktop build $BUILD from $GITHUB_SHA.

          - Windows x64: \`.exe\` installer. SmartScreen warns because it is unsigned.
          - macOS Apple Silicon (\`arm64\`) and Intel (\`x64\`): \`.dmg\`. Not notarized; approve it in System Settings → Privacy & Security on first launch.
          - Linux x64: \`.AppImage\`. Run \`chmod +x\` on it first; requires FUSE 2.

          No auto-update; install newer releases by hand.
          EOF
          )
          # Tag `desktop-<hash>` rather than the bare hash, which git would
          # confuse with the abbreviated commit id.
          # A re-run for the same commit replaces the assets of its release.
          if gh release view "desktop-$SHORT" >/dev/null 2>&1; then
            gh release upload "desktop-$SHORT" "${files[@]}" --clobber
            gh release edit "desktop-$SHORT" --notes "$notes"
          else
            gh release create "desktop-$SHORT" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$SHORT" \
              --notes "$notes"
          fi