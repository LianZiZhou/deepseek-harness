name: Fork desktop release

on:
  # CI1 and completed CI2 recovery dispatch only after the full sync has finished and all checkpoints are on the default branch.
  workflow_dispatch:
    inputs:
      sync_sha:
        description: Full fork head from the successful full sync (leave both SHAs empty to reconcile releases only)
        type: string
      upstream_sha:
        description: Full upstream head integrated by that full sync
        type: string
  # GitHub does not deliver another repository's release or tag events to this fork.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'LianZiZhou/deepseek-harness' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s .github/fork-release
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SHA: ${{ inputs.sync_sha }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: python3 .github/fork-release/release.py plan

  build:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    uses: ./.github/workflows/fork-build-release.yml
    with:
      release: ${{ toJSON(matrix.release) }}
    permissions:
      contents: write

  feeds:
    # A retry also repairs interrupted feed updates when all builds already exist.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    needs: [plan, build]
    concurrency:
      group: fork-release-feeds
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/fork-release/release.py feeds
