name: Fork upstream sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      recovery:
        type: boolean
        default: false
    secrets:
      FORK_SYNC_TOKEN:
        required: false

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: fork-upstream-writer
  queue: max

jobs:
  sync:
    if: github.repository == 'LianZiZhou/deepseek-harness' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      - run: python3 -B -m unittest discover -s .github/fork-sync
      - id: sync
        name: Replay fork patches onto upstream master
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_BRANCH: ${{ github.event.repository.default_branch }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=()
          if [[ "$RECOVERY" == true ]]; then args+=(--recovery); fi
          python3 .github/fork-sync/catchup.py "${args[@]}"
      - name: Dispatch nightly for the fully synchronized commit
        if: steps.sync.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.sync.outputs.head }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream }}
          FORK_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run fork-desktop-release.yml --ref "$FORK_BRANCH" \
            -f sync_sha="$HEAD_SHA" -f upstream_sha="$UPSTREAM_SHA"
