# Fork patch queue: every path the fork changes relative to upstream belongs to exactly one
# topic, to `generated`, or to `lockfile`. Topics are matched in order; the first matching
# glob wins. `patchqueue.py classify` fails on a changed path that no topic claims.
# Glob syntax: `*` matches within one path segment, `**/` matches any directory prefix,
# a trailing `/**` matches everything below a directory, and `{a,b}` lists alternatives.

# Derived from sources; never carried in a topic patch. Rebuilt after the queue applies.
[generated]
paths = [
  "docs/{event-producer-consumer,config-catalog,persistence-catalog,module-graph,capability-seams,tool-catalog,cli-help,graph-atlas,agent-lifecycle,tool-execution-pipeline,experimental-persistence-catalog}.md",
  "docs/{event-producer-consumer,config-catalog,persistence-catalog,module-graph,capability-seams,tool-catalog,cli-help,graph-atlas,agent-lifecycle,tool-execution-pipeline,experimental-persistence-catalog}.zh.md",
  "docs/persistence-schema.json",
  "packages/extensions/cordis-host-runner/src/api-catalog.ts",
  "packages/extensions/cordis-client-runner/src/client/{api,slot}-catalog.ts",
  "packages/llm/llm-pi-ai/src/provider-data.generated.ts",
  # Bilingual pairing records hash the paired Markdown; re-recorded for every pair a topic touches.
  "**/*.i18n.yaml",
]
commands = [
  ["pnpm", "run", "gen-provider-data"],
  ["pnpm", "run", "gen-cordis-api"],
  ["pnpm", "run", "gen-client-catalog"],
  ["pnpm", "run", "gen-config-catalog"],
  ["pnpm", "run", "gen-persistence-catalog"],
  ["pnpm", "run", "gen-module-graph"],
  ["pnpm", "run", "gen-doc-graphs"],
  ["pnpm", "run", "gen-tool-catalog"],
  ["pnpm", "run", "gen-cli-help"],
]
# Run once per sync with the Markdown pairs touched by any topic appended as arguments.
pairing = ["pnpm", "run", "verify-translation-pairing", "--write"]

# Taken from upstream and re-resolved against the fork's manifests, never three-way merged.
[lockfile]
paths = ["pnpm-lock.yaml"]
command = ["pnpm", "install", "--lockfile-only", "--ignore-scripts"]

