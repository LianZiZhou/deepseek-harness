                --batch --level LEVEL --risk RISK --random-agent；手工验证
                ' and 1=1 -- - 与 ' and 1=2 -- - 的响应差异；报错/延时注入 PAYLOAD 模板。`
              - XSS验证 → `目标占位流程：反射点 <script>alert(1)</script> 与
